quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/xcommerce
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=data.sql
quarkus.hibernate-orm.log.sql=true
quarkus.redis.hosts=redis://localhost:6379
quarkus.log.category."ma.aui.sse.it.xcommerce.monolithic".level=DEBUG
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.issuer=xcommerce
