name: "xcommerce_compose"

services:
  postgres:
    image: postgres:17-alpine
    container_name: xcommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - "pgdata:/var/lib/postgresql/data"      # <-- volume de données
      - "./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql"

  redis:
    image: redis:7-alpine
    container_name: xcommerce-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "no"] # pas de persistance
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:   # volume nommé pour Postgres
